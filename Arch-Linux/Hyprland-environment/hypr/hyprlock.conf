general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

#blur background
background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vignette = 0.1
    vignette_thickness = 0.3
}

#time
label {
    monitor = eDP-1
    text = $TIME
    color = rgb(255, 255, 255) # Azul Catppuccin
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "<span>$(date +'%A, %d/%M/%Y')</span>"
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# FOTO DE PERFIL
image {
    monitor = eDP-1
    path = /home/luizsousa/.face.icon
    size = 120
    border_size = 2
    border_color = rgb(137, 180, 250)
    position = 0, -100
    halign = center
    valign = center
}

# USERNAME
label {
    monitor = eDP-1
    text = $USER
    color = rgb(205, 214, 244)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

# PRHASE
label{
	monitor = eDP-1
	text = "By the way"
	color = #ffffff
	font_size = 12
	font_family = JetBrains Mono Nerd Font
	position: 0, -220
	
}

# CAMPO DE SENHA (Ajuste a posição para ficar abaixo do nome)
input-field {
    monitor = eDP-1
    size = 250, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -250
    halign = center
    valign = center
}
