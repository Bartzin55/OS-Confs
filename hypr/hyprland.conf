env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = QT_SCALE_FACTOR,1

# monitors config

## Monitor AOC 27
monitor = HDMI-A-1, 1920x1080@120, 0x0, 1

## Internal monitor
monitor = eDP-1, 1920x1080@60, 192x1080, 1.25

## general monitors
monitor = , preferred, auto, 1

# keyboard, touchpad and mouse configs
input {
	kb_layout = br
	kb_variant = abnt2

	follow_mouse = 3
	scroll_method = on_button_down
	scroll_button = 274
	    touchpad {
	        natural_scroll = true  # Isso ativa o scroll natural NO TOUCHPAD
	    }
	
	sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
	natural_scroll = false # Isso garante que o MOUSE use o scroll padrão
}

exec-once = hyprctl setcursor Bibata-Modern-Classic  24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,22

misc {
	focus_on_activate = true
	mouse_move_enables_dpms = true
	middle_click_paste = false
}

general {
#space betwenn windows
    gaps_in = 3
        
    # Espaço entre as janelas e a borda do monitor
    # (0 remove totalmente o espaço nas bordas)
    gaps_out = 5
    
    # Grossura da borda da janela
    border_size = 1

    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = true
}

decoration {
    rounding = 3
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}
#rules for specific sofwares
windowrule = size 1170 600, match:class nwg-displays
windowrule = float 1, match:class nwg-displays

windowrule = size 1170 600, match:class nwg-look
windowrule = float 1, match:class nwg-look

windowrule = size 600 400, match:class org\.pulseaudio\.pavucontrol
windowrule = float 1, match:class org\.pulseaudio\.pavucontrol


# keybinds
$mainMod = SUPER

## general
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod shift, F12, exec, poweroff
bind = $mainMod mod1, F12, exec, reboot
bind = $mainMod control, F12, exit
bind = $mainMod escape, F12, exec, ~/.config/hypr/hyprreset.sh
bind = $mainMod, L, exec, loginctl lock-session

##fechar a tampa suspende
bindl=,switch:on:Lid Status,exec,loginctl lock-session
bindl=,switch:on:Lid Status,exec,systemctl suspend

## Apps
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, b, exec, brave
bind = $mainMod alt, b, exec, firefox
bind = $mainMod, c, exec, VSCode
bind = control shift, escape, exec, alacritty -e htop


## Window management
### focus between windows
binde = $mainMod, left, movefocus, l
binde = $mainMod, right, movefocus, r
binde = $mainMod, up, movefocus, u
binde = $mainMod, down, movefocus, d
bind = $mainMod, X, killactive

### window movement
binde = $mainMod SHIFT, left, movewindow, l
binde = $mainMod SHIFT, right, movewindow, r
binde = $mainMod SHIFT, up, movewindow, u
binde = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, page_down, movetoworkspace, +1
bind = $mainMod SHIFT, page_up, movetoworkspace, -1

### workspace movement
bind = $mainMod, page_down, workspace, +1
bind = $mainMod, page_up, workspace, -1

## function keys
### audio and mic
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

### brightness
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

### print
bind = , Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_screenshot.png') | wl-copy

### copy and paste with history
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

#execute on startup
exec-once = udiskie -n &
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
